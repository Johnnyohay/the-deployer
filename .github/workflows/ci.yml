name: CI

# Typecheck the engine and run the golden test (the ANU pack must reproduce ANU's own output).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Lint the workflows (the template's too, since users get them as-is)
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint .github/workflows/*.yml template/.github/workflows/*.yml
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the ANU pack's site and the in-browser app
        env:
          DEPLOYER_PACK: packs/anu-defense-housing
        run: npm run build:api && npm run build:pages
